name: Release

# 打 tag（v1.0.1）即自动构建并创建 Release。
# 配置了签名证书 secrets 时产物与本地构建一致；未配置则为无签名构建（用户需手动放行）。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Import signing certificate (optional)
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "${CERT_P12}" ]; then
            echo "未配置 MACOS_CERT_P12：本次为无签名构建"
            exit 0
          fi
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k actions "$KEYCHAIN" >/dev/null
          # 让 codesign 在搜索列表里能找到这张身份
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          xcodegen generate
          if [ -z "${CERT_P12}" ]; then
            export CHASSIS_NO_SIGN=1
          else
            export CHASSIS_KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            export CHASSIS_CODE_SIGN_IDENTITY="Apple Development"
            export CHASSIS_SIGN_STYLE="Manual"
          fi
          ./Scripts/build.sh Release

      - name: Verify signature
        run: |
          APP=".build/xcode/Build/Products/Release/Chassis.app"
          codesign --verify --deep --strict "$APP"
          codesign -dv "$APP" 2>&1 | grep -E 'Identifier=|Authority|TeamIdentifier' || true
          if [ -n "$(codesign -dv "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p')" ]; then
            echo "签名身份有效"
          else
            echo "::warning::产物未签名，用户首次打开需手动放行"
          fi

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP=".build/xcode/Build/Products/Release/Chassis.app"
          mkdir -p dist
          hdiutil create -volname "Chassis" -srcfolder "$APP" -ov -format UDZO "dist/Chassis-$VERSION.dmg" >/dev/null
          /usr/bin/ditto -c -k --keepParent "$APP" "dist/Chassis-$VERSION.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
