name: Chassis
options:
  bundleIdPrefix: com.gaelthas
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  generateEmptyDirectories: false

packages:
  # 接口层是独立包，插件仓库与基座共用同一份声明
  PluginAPI:
    path: Packages/PluginAPI
  PluginSupport:
    path: Packages/PluginSupport
  # 根包：只剩基座机制（插件不在链接列表内）
  ChassisPackage:
    path: .

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    # 签名与父项目 Dock2Min 保持一致：Automatic + 开发证书。
    # TCC 的授权记录绑定「代码签名要求」：ad-hoc 签名的要求是 cdhash，每次构建都变，
    # 系统会把新构建当成另一个应用，于是每次编译后都要在系统设置里删掉旧条目再重新授权。
    # 用开发证书后，要求变成 identifier + 证书，重新构建不再影响授权。
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 4U5PHGQCK2
    CODE_SIGN_IDENTITY: "-"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": Apple Development

targets:
  Chassis:
    type: application
    platform: macOS
    sources:
      - path: HostApp
        excludes:
          - "Info.plist"
          - "Chassis.entitlements"
    dependencies:
      - package: PluginAPI
        product: PluginAPI
      - package: PluginSupport
        product: PluginSupport
      - package: ChassisPackage
        product: PluginKit
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleName: Chassis
        CFBundleDisplayName: Chassis
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        # 常驻菜单栏，不占 Dock
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 gaelthas"
        ChassisSummary: "插件化 macOS 工具基座"
        ChassisUpdateURL: "https://github.com/gaelthas/chassis/releases"
        # 插件市场：打包时填入线上索引地址与签名公钥；留空则市场页只显示配置说明
        ChassisMarketplaceURL: "https://raw.githubusercontent.com/gaelthas/Chassis-Plugins/main/Market/index.json"
        ChassisMarketplacePublicKey: "viVbaAgf2FQMGA0gDeXaaodeBoGH3/PiInmxQwGAizM="
    entitlements:
      path: HostApp/Chassis.entitlements
      properties:
        com.apple.security.app-sandbox: false
        # 外部插件是动态库：异 Team 签名时必须关闭 Library Validation。
        # 运行时仍由 PluginInstaller 的 Team 白名单 + 「允许第三方插件」开关二次限制。
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaelthas.chassis
        PRODUCT_NAME: Chassis
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 2
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Swift 插件包通过 `-undefined dynamic_lookup` 引用基座里的 PluginAPI 符号，
        # 主可执行文件必须把这些符号导出到动态符号表。
        OTHER_LDFLAGS:
          - $(inherited)
          - -Xlinker
          - -export_dynamic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HostApp/Info.plist
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: YES
          # 关闭调试 dylib：插件包通过 dynamic_lookup 从主可执行文件解析符号，
          # 代码若被拆到 Chassis.debug.dylib 里就找不到 PluginAPI。
          ENABLE_DEBUG_DYLIB: NO
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

schemes:
  Chassis:
    build:
      targets:
        Chassis: all
    run:
      config: Debug
    archive:
      config: Release
